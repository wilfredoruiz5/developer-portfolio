
name: Deploy Portfolio and Angular Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular-demo/package-lock.json

      - name: Install dependencies
        working-directory: angular-demo
        run: npm ci

      - name: Build Angular
        working-directory: angular-demo
        run: npx ng build --base-href /developer-portfolio/angular-demo/

      - name: Prepare website
        run: |
          mkdir -p public/angular-demo
          cp dashboard/index.html public/index.html
          cp -R angular-demo/dist/angular-demo/browser/. public/angular-demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
